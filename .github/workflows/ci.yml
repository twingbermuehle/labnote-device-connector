name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    name: go build, vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  web:
    name: setup-screen preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
